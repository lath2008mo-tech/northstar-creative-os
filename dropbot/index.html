<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dropbot</title>
<style>
body { margin:0; font-family:-apple-system,sans-serif; background:#11110f; color:#f6f3ea; }
main { padding:16px; max-width:640px; margin:auto; }
.card { background:#1c1b17; border:1px solid #2e2c26; border-radius:16px; padding:14px; margin:12px 0; }
input, textarea { width:100%; box-sizing:border-box; background:#14140f; color:#f6f3ea; border:1px solid #2e2c26; border-radius:12px; padding:12px; font-size:16px; margin-top:8px; }
button, a.btn { display:block; width:100%; text-align:center; text-decoration:none; background:#d6ff4a; color:#16160f; border:0; border-radius:14px; padding:14px; font-weight:700; margin-top:8px; }
p { color:#b7b1a4; }
</style>
</head>
<body>
<main>
<h1>Dropbot</h1>
<p>Gemini är motorn. 0 kr. Ingen nyckel.</p>
<section class="card">
<a class="btn" href="https://gemini.google.com/app">Öppna Gemini</a>
<input id="namn" value="Självrengörande pälsroller">
<input id="pris" value="179 kr">
<textarea id="ref" rows="3">Före/efter på soffan. Hook direkt.</textarea>
<button id="go">Kopiera prompt och öppna Gemini</button>
<p id="msg"></p>
</section>
<section class="card">
<a class="btn" href="https://labs.google.com/pomelli">Pomelli, bilder</a>
</section>
</main>
<script>
document.getElementById("go").onclick = async () => {
  const text = "Skriv på svenska. Hitta inte på fakta. Gör tre egna annonser, inte kopior.\nProdukt: " + document.getElementById("namn").value + "\nPris: " + document.getElementById("pris").value + "\nUpplägg från en annons som går: " + document.getElementById("ref").value + "\nVarje annons: hook, 2 meningar, avslut med länken i bio. Säg till om produkten kan kräva CE eller vara otillåten i EU.";
  await navigator.clipboard.writeText(text);
  document.getElementById("msg").textContent = "Kopierad. Klistra in i Gemini.";
  window.open("https://gemini.google.com/app", "_blank");
};
</script>
</body>
</html>
