<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annons</title>
<style>
body { margin:0; font-family:-apple-system,sans-serif; background:#fff; color:#111; }
main { padding:20px; max-width:480px; margin:auto; }
a, button { display:block; text-align:center; text-decoration:none; background:#111; color:#fff; border:0; border-radius:12px; padding:16px; font-size:18px; margin:12px 0; }
p { font-size:18px; }
</style>
</head>
<body>
<main>
<h1>Tre steg</h1>
<p>Pälsroller. 179 kr.</p>
<a href="https://gemini.google.com/app">1. Skriv texten i Gemini</a>
<a href="https://labs.google.com/pomelli">2. Gör bilden i Pomelli</a>
<button id="go">3. Kopiera texten</button>
<p id="msg"></p>
</main>
<script>
document.getElementById("go").onclick = async () => {
  await navigator.clipboard.writeText("Pälsen sitter kvar i soffan. En roller, 179 kr. Länken i bio.");
  document.getElementById("msg").textContent = "Kopierad.";
};
</script>
</body>
</html>
